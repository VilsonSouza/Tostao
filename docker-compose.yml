services:
  db:
    image: postgres:16
    container_name: tostao-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tostao}
      POSTGRES_USER: ${POSTGRES_USER:-tostao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tostao_dev}
    ports:
      - "5432:5432"
    volumes:
      - tostao-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tostao}"]
      interval: 5s
      retries: 10
volumes:
  tostao-data:
